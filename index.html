<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="description" content="Ticketmaster mobile experience — a front-end clone with live events, watchlist, tickets and account.">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ticketmaster">
  <title>Ticketmaster — Live Events</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="stage" aria-hidden="true"></div>
  <div class="app-frame" id="appFrame">
    <main id="view" class="view" aria-live="polite"></main>
    <nav id="tabbar" class="tabbar" aria-label="Primary"></nav>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="modalRoot"></div>
  </div>
  <noscript>
    <div class="noscript">This Ticketmaster demo needs JavaScript enabled.</div>
  </noscript>
  <script src="app.js" defer></script>
</body>
</html>
